name: temp-apns-key-update
on:
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: bun install (for push:test)
        run: bun install --frozen-lockfile

      - name: SSH probe + Coolify env update via host
        env:
          NEW_KEY_B64: ${{ secrets.TEMP_RYOS_APNS_KEY_B64 }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::${NEW_KEY_B64}"
          echo "::add-mask::${COOLIFY_TOKEN}"
          echo "new_key_b64_len=${#NEW_KEY_B64}"
          tailscale status | head -40

          # Probe SSH paths (CI tagged node may skip interactive check)
          for host in ryos-dev 100.111.149.54 ryos-prod-a 100.97.170.122; do
            echo "=== ssh probe $host ==="
            timeout 20 ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 root@"$host" 'echo SSH_OK; hostname; whoami' 2>&1 | sed 's/[A-Za-z0-9+/=_-]\{40\}/[LONG]/g' | head -20 || true
            timeout 20 tailscale ssh root@"$host" -- 'echo TS_SSH_OK; hostname' 2>&1 | sed 's/[A-Za-z0-9+/=_-]\{40\}/[LONG]/g' | head -20 || true
          done

          # Write key to a temp file on runner for scp if SSH works
          umask 077
          printf '%s' "$NEW_KEY_B64" > /tmp/new_key.b64
          echo "wrote_local_b64_len=$(wc -c < /tmp/new_key.b64)"

          # If SSH to ryos-dev works, update Coolify DB / create write token
          update_via_ssh() {
            local host="$1"
            echo "Attempting Coolify env update via SSH on $host"
            # Copy b64 without printing
            timeout 30 scp -o BatchMode=yes -o StrictHostKeyChecking=accept-new /tmp/new_key.b64 root@"$host":/tmp/new_key.b64
            timeout 120 ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new root@"$host" bash -s <<'REMOTE'
          set -euo pipefail
          echo "remote_hostname=$(hostname)"
          docker ps --format '{{.Names}}' | head -40
          # Find coolify containers
          COOLIFY_CT=$(docker ps --format '{{.Names}}' | grep -E '^coolify$' | head -1 || true)
          DB_CT=$(docker ps --format '{{.Names}}' | grep -E 'coolify-db|coolify_db' | head -1 || true)
          echo "coolify_ct=${COOLIFY_CT:-none} db_ct=${DB_CT:-none}"
          B64_LEN=$(wc -c < /tmp/new_key.b64 | tr -d ' ')
          echo "remote_b64_len=$B64_LEN"
          NEW_VAL=$(cat /tmp/new_key.b64)
          # Prefer artisan tinker / DB update for both app UUIDs
          APP_UUIDS="atf4yjhkpmkyz5laip477ebm hswkgooccww480k088s4skgg"
          if [ -n "${COOLIFY_CT:-}" ]; then
            for UUID in $APP_UUIDS; do
              echo "Updating env for app $UUID via coolify artisan"
              # Use PHP inside coolify to update EnvironmentVariable without echoing value
              docker exec -i "$COOLIFY_CT" php -r '
          require "/var/www/html/vendor/autoload.php";
          $app = require "/var/www/html/bootstrap/app.php";
          $kernel = $app->make(Illuminate\Contracts\Console\Kernel::class);
          $kernel->bootstrap();
          $uuid = $argv[1];
          $val = stream_get_contents(STDIN);
          $appModel = App\Models\Application::where("uuid", $uuid)->first();
          if (!$appModel) { fwrite(STDERR, "app_not_found\n"); exit(2); }
          $env = $appModel->environment_variables()->where("key", "RYOS_APNS_KEY_B64")->first();
          if ($env) {
            $env->value = $val;
            $env->save();
            echo "updated_existing\n";
          } else {
            $appModel->environment_variables()->create([
              "key" => "RYOS_APNS_KEY_B64",
              "value" => $val,
              "is_literal" => true,
              "is_runtime" => true,
              "is_buildtime" => false,
              "is_preview" => false,
              "is_shown_once" => false,
            ]);
            echo "created_new\n";
          }
          $check = $appModel->environment_variables()->where("key", "RYOS_APNS_KEY_B64")->first();
          echo "stored_len=" . strlen((string)$check->value) . "\n";
          ' "$UUID" < /tmp/new_key.b64
            done
            # Restart applications via artisan or docker
            for UUID in $APP_UUIDS; do
              echo "restart hint for $UUID"
            done
          elif [ -n "${DB_CT:-}" ]; then
            echo "No coolify app container; attempting SQL update"
            # Find table/columns carefully without printing values
            docker exec "$DB_CT" psql -U coolify -d coolify -c "\dt" | head -40
          else
            echo "No coolify containers found"
            exit 10
          fi
          shred -u /tmp/new_key.b64 2>/dev/null || rm -f /tmp/new_key.b64
          echo REMOTE_DONE
          REMOTE
          }

          SSH_OK=0
          for host in ryos-dev 100.111.149.54; do
            if timeout 15 ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 root@"$host" 'echo OK' 2>/dev/null | grep -q OK; then
              update_via_ssh "$host" && SSH_OK=1 && break
            fi
          done

          if [ "$SSH_OK" != "1" ]; then
            echo "::error::SSH from CI to Coolify host failed; cannot update env (API token is deploy/read-only, PATCH=403)."
            echo "BLOCKER=need_write_token_or_tailscale_ssh_acl"
            exit 1
          fi

          # Restart via existing read/deploy token
          for uuid in atf4yjhkpmkyz5laip477ebm hswkgooccww480k088s4skgg; do
            code=$(curl -sS -o /tmp/rst.json -w '%{http_code}' -X GET -H "Authorization: Bearer ${COOLIFY_TOKEN}" -H 'Accept: application/json' "https://coolify.ryo.lu/api/v1/applications/${uuid}/restart" || echo 000)
            echo "restart_$uuid=$code"
          done
          sleep 40

          # push:test with new key; team/key id must come from somewhere.
          # Read TEAM_ID/KEY_ID from application env via SSH/php without printing
          timeout 60 ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new root@ryos-dev bash -s <<'REMOTE' > /tmp/apns_ids.env
          set -euo pipefail
          COOLIFY_CT=$(docker ps --format '{{.Names}}' | grep -E '^coolify$' | head -1)
          docker exec "$COOLIFY_CT" php -r '
          require "/var/www/html/vendor/autoload.php";
          $app = require "/var/www/html/bootstrap/app.php";
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $m = App\Models\Application::where("uuid", "atf4yjhkpmkyz5laip477ebm")->first();
          foreach (["RYOS_APNS_TEAM_ID","RYOS_APNS_KEY_ID"] as $k) {
            $e = $m->environment_variables()->where("key", $k)->first();
            echo $k."=".(($e && $e->value !== null) ? $e->value : "")."\n";
          }
          '
          REMOTE
          # Mask lines
          while IFS= read -r line; do
            val="${line#*=}"
            echo "::add-mask::${val}"
          done < /tmp/apns_ids.env
          set -a
          # shellcheck disable=SC1091
          source /tmp/apns_ids.env
          set +a
          export RYOS_APNS_KEY_B64="$NEW_KEY_B64"
          echo "team_id_len=${#RYOS_APNS_TEAM_ID} key_id_len=${#RYOS_APNS_KEY_ID}"
          FAKE=$(python3 -c 'print("ab"*32)')
          for envname in sandbox prod; do
            echo "=== push:test $envname ==="
            set +e
            OUT=$(bun run push:test "$FAKE" "$envname" 2>&1)
            EC=$?
            set -e
            SAFE=$(printf '%s' "$OUT" | sed -E 's/[A-Za-z0-9+/=_-]{40,}/[REDACTED]/g')
            echo "$SAFE" | tail -40
            echo "push_test_exit=$EC"
            echo "$SAFE" | grep -E 'BadDeviceToken|POINT_IS_NOT_ON_CURVE|InvalidProviderToken|400|520' || true
          done
          curl -sS -o /dev/null -w 'http2_prod=%{http_code}\n' --http2 https://api.push.apple.com/ || true
          shred -u /tmp/new_key.b64 /tmp/apns_ids.env 2>/dev/null || rm -f /tmp/new_key.b64 /tmp/apns_ids.env
