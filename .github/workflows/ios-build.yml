name: iOS shell

# The Swift shell under ios/ cannot build on the Linux jobs. Compile it
# unsigned, and run CodeQL's Swift autobuild exactly as code scanning's
# default setup does (default setup only scans Swift on pushes to main, so a
# broken autobuild would otherwise surface only after merge). Results are not
# uploaded: default setup owns code scanning uploads for this repo.

on:
  pull_request:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

concurrency:
  group: ios-shell-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (unsigned)
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Xcode version
        run: xcodebuild -version

      - name: Build app and tests
        run: |
          xcodebuild build-for-testing \
            -project ryOS.xcodeproj \
            -scheme ryOS \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

  codeql-swift-autobuild:
    name: CodeQL Swift autobuild (no upload)
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: autobuild

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:swift"
          upload: never
